<app-nav-header></app-nav-header>
<div class="map-section">
    <iframe style="border:0; width: 100%; height: 350px;"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2214.741992867658!2d105.8499652702865!3d21.00316882585209!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ac748cd9d447%3A0xaf1371c17f07550c!2zMTkgUC4gTMOqIFRoYW5oIE5naOG7iywgQuG6oWNoIE1haSwgSGFpIELDoCBUcsawbmcsIEjDoCBO4buZaSwgVmnhu4d0IE5hbQ!5e0!3m2!1svi!2s!4v1714467981899!5m2!1svi!2s"
        frameborder="0" allowfullscreen></iframe>
</div>
<section id="contact" class="contact">
    <div class="container">

        <div class="row justify-content-center" data-aos="fade-up">

            <div class="col-lg-10">

                <div class="info-wrap">
                    <div class="row">
                        <div class="col-lg-4 info">
                            <i class="bi bi-geo-alt"></i>
                            <h4>Location:</h4>
                            <p>19 P. Lê Thanh Nghị, Bạch Mai, Hai Bà Trưng<br> Hà Nội </p>
                        </div>

                        <div class="col-lg-4 info mt-4 mt-lg-0">
                            <i class="bi bi-envelope"></i>
                            <h4>Email:</h4>
                            <p>{{'rmall@gmail.com'}}</p>
                        </div>

                        <div class="col-lg-4 info mt-4 mt-lg-0">
                            <i class="bi bi-phone"></i>
                            <h4>Call:</h4>
                            <p>+2365 2556 22</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <div class="row mt-5 justify-content-center" data-aos="fade-up">
            <div class="col-lg-10">
                <div class="row">
                    <div class="col-md-6 form-group mt-3 mt-md-0">
                        <input type="email" class="form-control" name="email" id="email" placeholder="Your Email"
                            required [(ngModel)]="email">
                        <div><sup>{{response.errors.userEmailError}}</sup></div>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <textarea class="form-control" name="message" rows="5" placeholder="Feedback" required
                        [(ngModel)]="feedback"></textarea>
                    <div><sup>{{response.errors.emptyFeedbackError}}</sup></div>
                </div>

                <div class="text-center"><button (click)="sentFeedback()">Send Feedback</button></div>

                <div *ngIf="response.isModified">Feedback sent!</div>

            </div>

        </div>

    </div>
</section>
<app-footer></app-footer>
