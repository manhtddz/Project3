<header>
    <nav>
        <div class="logo-search">
            <a routerLink="/home" class="logo">R<span>-Mall</span></a>
            <ul class="menu">
                <li><a routerLink="/home" routerLinkActive="active">Home</a></li>
                <li><a routerLink="/movieTheater" routerLinkActive="active">Cinema</a></li>
                <li class="dropdown"><a><span>Marketspace</span><i
                            class="bi bi-chevron-down"></i></a>
                    <ul *ngIf="types">
                        <li *ngFor="let type of types"><a routerLink="/product/{{type.id}}/gallery"
                                routerLinkActive="active" (click)="setType(type.id)">{{type.name}}</a></li>
                    </ul>
                </li>
                <li><a routerLink="/aboutUs" routerLinkActive="active">About Us</a></li>
                <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
            </ul>
            <div class="social-icons">
                <a routerLink="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a routerLink="#"><i class="fa-brands fa-instagram"></i></a>
                <a routerLink="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
    </nav>
</header>
