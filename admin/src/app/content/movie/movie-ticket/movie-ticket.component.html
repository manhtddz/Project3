<div class="card shadow mb-0">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between" *ngIf="movie">
        <h6 class="m-0 font-weight-bold text-primary">{{movie.name}}'s tickets</h6>
    </div>
    <!-- Card Body -->

    <div class="card-body" *ngIf="tickets">
        <div class="table-responsive">

            <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Theater</th>
                        <th>Seat</th>
                        <th>Price</th>
                        <th>Date</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>User</th>
                        <th>Active</th>
                    </tr>
                </thead>

                <tbody *ngFor="let ticket of tickets;let i = index">
                    <tr>
                        <td>{{ticket.id}}</td>
                        <td>{{ticket.theater}}</td>
                        <td>{{ticket.seat}}</td>
                        <td (keyup)="moneyConvert(movie.price,$event)">{{movie.price| number: '1.0-0'}} vnđ</td>
                        <td>{{ticket.date}}</td>
                        <td>{{ticket.startTime}}</td>
                        <td>{{ticket.endTime}}</td>
                        <td>{{ticket.user}}</td>
                        <td>{{ticket.active ? 'active':'disabled'}}</td>
                    </tr>

                </tbody>
            </table>
            <div class="load-page" *ngIf="pageCount > 1">
                <button class="custom-button" (click)="prev()" [disabled]="startIndex == 0"><</button>
                <input type="text" [value]="startIndex + 1" disabled class="start-index">
                <button class="custom-button" (click)="next()"
                    [disabled]="startIndex*stepIndex + stepIndex >= length">></button>
            </div>
            <span class="total-pages">Total pages: {{pageCount}}</span>
        </div>
    </div>
</div>
