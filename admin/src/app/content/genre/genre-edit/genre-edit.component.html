<div class="card">
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-sm-3" *ngIf="genre">
                <div>{{response.error.nameError}}</div>
                <h6 class="mb-0">Genre: </h6>
            </div>
            <div class="col-sm-9 text-secondary" *ngIf="genre">
                <input type="text" class="form-control" [(ngModel)]="genre.name">
                <div><sup>{{response.error.nameError}}</sup></div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-3"></div>
            <div class="col-sm-9 text-secondary" *ngIf="!response.isModified">
                <input type="button" class="btn btn-primary px-4" value="Save Changes" (click)="editGenre()">
            </div>
            <div class="col-sm-9 text-secondary" *ngIf="response.isModified">
                <div><sup>Genre edit successfully</sup></div>
                <input type="button" class="btn btn-primary px-4" value="Turn Back"
                    routerLink="/redirectGenre">
            </div>
        </div>
    </div>
</div>
