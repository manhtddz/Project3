<div class="card shadow mb-0">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary">Genres</h6>
    </div>
    <!-- Card Body -->

    <div class="card-body">
        <div class="table-responsive">
            <button class="btn bg-primary text-white" routerLink="/genre/create">Create</button>

            <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody *ngFor="let genre of response;let i = index">
                    <tr>
                        <td class="w-25">{{genre.id}}</td>
                        <td class="w-25">{{genre.name}}</td>
                        <td class="w-25">
                            <button class="btn btn-outline-info" routerLink="/genre/{{genre.id}}/details">Details</button>
                            <button class="btn btn-outline-primary" routerLink="/genre/{{genre.id}}/edit">Edit</button>
                            <button class="btn btn-outline-danger" routerLink="/genre/{{genre.id}}/delete">Delete</button>
                        </td>
                    </tr>

                </tbody>
            </table>
            <div class="load-page" *ngIf="pageCount > 1">
                <button class="custom-button" (click)="prev()" [disabled]="startIndex == 0"><</button>
                <input type="text" [value]="startIndex + 1" disabled class="start-index">
                <button class="custom-button" (click)="next()"
                    [disabled]="startIndex*stepIndex + stepIndex >= length">></button>
            </div>
            <span class="total-pages">Total pages: {{pageCount}}</span>
        </div>
    </div>
</div>
